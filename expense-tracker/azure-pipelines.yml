trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  MAVEN_OPTS: '-Xmx1024m'

stages:
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildJob
        displayName: 'Maven Build'
        steps:
          # 1️⃣ Checkout code
          - task: Checkout@2

          # 2️⃣ Set up Java 17
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
          
          # 3️⃣ Cache Maven dependencies
          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              path: ~/.m2/repository
              restoreKeys: |
                maven | "$(Agent.OS)" | **/pom.xml

          # 4️⃣ SonarQube Analysis
          - task: SonarQubePrepare@5
            inputs:
              SonarQube: 'SonarQubeServiceConnection' # Name of your SonarQube service connection in Azure DevOps
              scannerMode: 'CLI'
              configMode: 'manual'
              cliProjectKey: 'expense-tracker'
              cliProjectName: 'Expense Tracker App'
              extraProperties: |
                sonar.java.source=17

          - script: mvn -B clean verify
            displayName: 'Maven Build and Tests'

          - task: SonarQubeAnalyze@5

          - task: SonarQubePublish@5
            inputs:
              pollingTimeoutSec: '300'

          # 5️⃣ Package JAR
          - script: mvn -B package -DskipTests
            displayName: 'Package JAR'

          # 6️⃣ Publish artifact
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'target/expense-tracker-0.0.1-SNAPSHOT.jar'
              artifact: 'expense-tracker-jar'
